name: Homebrew install

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Install the formula from this revision
        shell: bash
        run: |
          brew tap vibead/tap "$GITHUB_WORKSPACE"
          brew install vibead/tap/vibead
          brew test vibead/tap/vibead
          vibead --version
          vibead --help
      - name: Verify removal
        run: brew uninstall vibead
